spring.application.name=api-management-service

server.port=8081

info.app.name=API Management Service
info.app.Description=API management service for storing API related metrics

spring.datasource.url=jdbc:mysql://localhost:3306/gatekeeper_management
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

security.jwt.expiration-seconds=3600
security.jwt.secret=gatekeeper-demo-secret-key-and-it-should-be-long-as-well

gateway.kafka.configuration-topic=${GATEKEEPER_CONFIGURATION_TOPIC:gateway-configuration-events}
spring.kafka.bootstrap-servers=${GATEKEEPER_KAFKA_SERVERS:localhost:9092}
